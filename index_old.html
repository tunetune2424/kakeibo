<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>残高管理アプリ Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-static@0.321.0/font/lucide.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .animate-slide-in { animation: slideIn 0.3s ease-out forwards; }
        .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
        .animate-zoom-in { animation: zoomIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        body { 
            -webkit-tap-highlight-color: transparent; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            overscroll-behavior-y: contain;
        }
        .glass-header {
            background: rgba(67, 56, 202, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // Firebase設定
        const firebaseConfig = {
            apiKey: "",
            authDomain: "",
            projectId: "",
            storageBucket: "",
            messagingSenderId: "",
            appId: "",
            measurementId: ""
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const { FieldValue } = firebase.firestore;

        const Icon = ({ name, size = 20, className = "" }) => (
            <i className={`lucide-${name} ${className}`} style={{ fontSize: size, width: size, height: size }}></i>
        );

        const App = () => {
            const getCurrentMonthStr = () => {
                const now = new Date();
                return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
            };

            const [view, setView] = useState('home'); 
            const [currentMonth, setCurrentMonth] = useState(getCurrentMonthStr());
            const [isMonthPickerOpen, setIsMonthPickerOpen] = useState(false);
            
            const [budget, setBudget] = useState(0);
            const [tagBudgets, setTagBudgets] = useState({});
            const [expenses, setExpenses] = useState([]);
            const [tags, setTags] = useState(['食費', '日用品', '交通費', '娯楽']);
            
            const [itemName, setItemName] = useState('');
            const [itemAmount, setItemAmount] = useState('');
            const [selectedTag, setSelectedTag] = useState('');
            
            const [isSettingBudget, setIsSettingBudget] = useState(false);
            const [tempBudget, setTempBudget] = useState('');
            
            const [isAddingTag, setIsAddingTag] = useState(false);
            const [newTagName, setNewTagName] = useState('');
            const [editingId, setEditingId] = useState(null);
            const [editName, setEditName] = useState('');
            const [editAmount, setEditAmount] = useState('');
            const [editTag, setEditTag] = useState('');

            const [tagToEditBudget, setTagToEditBudget] = useState(null);
            const [tempTagBudget, setTempTagBudget] = useState('');
            const [selectedTagDetail, setSelectedTagDetail] = useState(null);
            const [isMigrating, setIsMigrating] = useState(false);
            const [undoToast, setUndoToast] = useState(null);

            const itemNameInputRef = useRef(null);
            const itemAmountInputRef = useRef(null);
            const undoTimerRef = useRef(null);

            // データの読み込み
            useEffect(() => {
                let isCancelled = false;
                const monthRef = db.collection("months").doc(currentMonth);

                const unsubscribeMonth = monthRef.onSnapshot(async (doc) => {
                    if (isCancelled) return;

                    if (doc.exists) {
                        const data = doc.data() || {};
                        setBudget(Number(data.budget || 0));
                        setTagBudgets(data.tagBudgets || {});
                        if (data.tags) setTags(data.tags);

                        // 旧形式 (months/{YYYY-MM}.expenses = []) の自動移行（1回だけ）
                        if (!isMigrating && Array.isArray(data.expenses) && data.expenses.length > 0 && !data.migratedToSubcollection) {
                            setIsMigrating(true);
                            try {
                                const batch = db.batch();
                                const expensesCol = monthRef.collection("expenses");
                                data.expenses.forEach((item) => {
                                    const name = (item?.name ?? "").toString();
                                    const amount = Number(item?.amount ?? 0);
                                    const tag = (item?.tag ?? "未分類").toString();
                                    const createdAtMillis =
                                        typeof item?.createdAtMillis === "number"
                                            ? item.createdAtMillis
                                            : (typeof item?.id === "number" ? item.id : Date.now());
                                    const dateStr = item?.date ? String(item.date) : null;

                                    const docRef = expensesCol.doc(); // auto id
                                    batch.set(docRef, {
                                        name,
                                        amount,
                                        tag,
                                        createdAtMillis,
                                        createdAt: FieldValue.serverTimestamp(),
                                        ...(dateStr ? { legacyDateStr: dateStr } : {})
                                    });
                                });
                                batch.set(monthRef, {
                                    migratedToSubcollection: true,
                                    migratedAt: FieldValue.serverTimestamp(),
                                    expenses: FieldValue.delete()
                                }, { merge: true });
                                await batch.commit();
                            } catch (e) {
                                console.error("Migration Error:", e);
                            } finally {
                                if (!isCancelled) setIsMigrating(false);
                            }
                        }
                    } else {
                        setBudget(0);
                        setTagBudgets({});
                        updateFirebase({ tags: ['食費', '日用品', '交通費', '娯楽'] });
                    }
                }, (error) => console.error("Firestore error:", error));

                const unsubscribeExpenses = monthRef
                    .collection("expenses")
                    .orderBy("createdAtMillis", "desc")
                    .onSnapshot((snapshot) => {
                        if (isCancelled) return;
                        const list = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                        setExpenses(list);
                    }, (error) => console.error("Firestore error:", error));

                return () => {
                    isCancelled = true;
                    unsubscribeMonth();
                    unsubscribeExpenses();
                };
            }, [currentMonth]);

            const updateFirebase = async (updates) => {
                try {
                    const docRef = db.collection("months").doc(currentMonth);
                    await docRef.set(updates, { merge: true });
                } catch (e) {
                    console.error("Firebase Error:", e);
                }
            };

            const changeMonth = (offset) => {
                const [year, month] = currentMonth.split('-').map(Number);
                const date = new Date(year, month - 1 + offset, 1);
                const nextMonth = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
                setCurrentMonth(nextMonth);
                closeAllModals();
            };

            const setSpecificMonth = (y, m) => {
                setCurrentMonth(`${y}-${String(m).padStart(2, '0')}`);
                setIsMonthPickerOpen(false);
            };

            const closeAllModals = () => {
                setEditingId(null);
                setTagToEditBudget(null);
                setIsAddingTag(false);
                setSelectedTagDetail(null);
                setIsSettingBudget(false);
                setIsMonthPickerOpen(false);
            };

            const tagColor = (tag) => {
                const palettes = [
                    { bg: 'bg-indigo-600', text: 'text-white', border: 'border-indigo-200', softBg: 'bg-indigo-50', softText: 'text-indigo-700' },
                    { bg: 'bg-emerald-600', text: 'text-white', border: 'border-emerald-200', softBg: 'bg-emerald-50', softText: 'text-emerald-700' },
                    { bg: 'bg-amber-500', text: 'text-white', border: 'border-amber-200', softBg: 'bg-amber-50', softText: 'text-amber-700' },
                    { bg: 'bg-rose-600', text: 'text-white', border: 'border-rose-200', softBg: 'bg-rose-50', softText: 'text-rose-700' },
                    { bg: 'bg-sky-600', text: 'text-white', border: 'border-sky-200', softBg: 'bg-sky-50', softText: 'text-sky-700' },
                    { bg: 'bg-violet-600', text: 'text-white', border: 'border-violet-200', softBg: 'bg-violet-50', softText: 'text-violet-700' },
                    { bg: 'bg-teal-600', text: 'text-white', border: 'border-teal-200', softBg: 'bg-teal-50', softText: 'text-teal-700' },
                    { bg: 'bg-fuchsia-600', text: 'text-white', border: 'border-fuchsia-200', softBg: 'bg-fuchsia-50', softText: 'text-fuchsia-700' }
                ];
                const s = (tag || '未分類').toString();
                let hash = 0;
                for (let i = 0; i < s.length; i++) hash = (hash * 31 + s.charCodeAt(i)) >>> 0;
                return palettes[hash % palettes.length];
            };

            const addExpense = async (e) => {
                e.preventDefault();
                if (!itemName || !itemAmount || Number(itemAmount) <= 0) return;
                try {
                    const monthRef = db.collection("months").doc(currentMonth);
                    const expenseRef = monthRef.collection("expenses").doc();
                    await expenseRef.set({
                        name: itemName,
                        amount: Number(itemAmount),
                        tag: selectedTag || '未分類',
                        createdAtMillis: Date.now(),
                        createdAt: FieldValue.serverTimestamp()
                    });
                    setItemName(''); setItemAmount(''); setSelectedTag('');
                    requestAnimationFrame(() => {
                        itemNameInputRef.current?.focus?.();
                    });
                } catch (e2) {
                    console.error("Firebase Error:", e2);
                }
            };

            const deleteExpense = async (id) => {
                if (!confirm("この支出を削除しますか？")) return;
                try {
                    const monthRef = db.collection("months").doc(currentMonth);
                    const docRef = monthRef.collection("expenses").doc(id);
                    const snap = await docRef.get();
                    if (!snap.exists) return;
                    const deletedData = snap.data();
                    await docRef.delete();

                    if (undoTimerRef.current) clearTimeout(undoTimerRef.current);
                    setUndoToast({
                        month: currentMonth,
                        id,
                        data: deletedData,
                        label: deletedData?.name ? String(deletedData.name) : '支出'
                    });
                    undoTimerRef.current = setTimeout(() => {
                        setUndoToast(null);
                        undoTimerRef.current = null;
                    }, 5000);
                } catch (e) {
                    console.error("Firebase Error:", e);
                }
            };

            const undoDelete = async () => {
                if (!undoToast) return;
                try {
                    const monthRef = db.collection("months").doc(undoToast.month);
                    await monthRef.collection("expenses").doc(undoToast.id).set({
                        ...undoToast.data,
                        restoredAt: FieldValue.serverTimestamp()
                    }, { merge: true });
                } catch (e) {
                    console.error("Firebase Error:", e);
                } finally {
                    if (undoTimerRef.current) clearTimeout(undoTimerRef.current);
                    undoTimerRef.current = null;
                    setUndoToast(null);
                }
            };

            const startEdit = (item) => {
                setEditingId(item.id);
                setEditName(item.name);
                setEditAmount(item.amount);
                setEditTag(item.tag);
            };

            const saveEdit = async () => {
                try {
                    await db.collection("months").doc(currentMonth).collection("expenses").doc(editingId).set({
                        name: editName,
                        amount: Number(editAmount),
                        tag: editTag,
                        updatedAt: FieldValue.serverTimestamp()
                    }, { merge: true });
                    setEditingId(null);
                } catch (e) {
                    console.error("Firebase Error:", e);
                }
            };

            const saveTagBudget = () => {
                if (tagToEditBudget) {
                    const newTagBudgets = { ...tagBudgets, [tagToEditBudget]: Number(tempTagBudget) };
                    updateFirebase({ tagBudgets: newTagBudgets });
                    setTagToEditBudget(null);
                    setTempTagBudget('');
                }
            };

            const handleAddTag = () => {
                if (newTagName && !tags.includes(newTagName)) {
                    const updatedTags = [...tags, newTagName];
                    setTags(updatedTags);
                    updateFirebase({ tags: updatedTags });
                    setNewTagName('');
                    setIsAddingTag(false);
                }
            };

            const totalSpent = expenses.reduce((sum, item) => sum + item.amount, 0);
            const balance = budget - totalSpent;
            const spentPercentage = budget > 0 ? (totalSpent / budget) * 100 : 0;

            const canSubmitExpense = itemName.trim().length > 0 && Number(itemAmount) > 0;
            const formatExpenseDate = (item) => {
                if (typeof item?.createdAtMillis === 'number') {
                    return new Date(item.createdAtMillis).toLocaleString('ja-JP', {
                        month: '2-digit',
                        day: '2-digit',
                        hour: '2-digit',
                        minute: '2-digit'
                    });
                }
                if (item?.legacyDateStr) return String(item.legacyDateStr);
                if (item?.date) return String(item.date);
                return '';
            };

            const tagStats = useMemo(() => {
                const stats = {};
                tags.forEach(tag => {
                    stats[tag] = { spent: 0, budget: tagBudgets[tag] || 0 };
                });
                expenses.forEach(exp => {
                    if (stats[exp.tag]) {
                        stats[exp.tag].spent += exp.amount;
                    }
                });
                return stats;
            }, [expenses, tags, tagBudgets]);

            const displayDate = () => {
                const [y, m] = currentMonth.split('-');
                return { year: y, month: parseInt(m) };
            };

            const quickMonthSelect = useMemo(() => {
                const [y, m] = currentMonth.split('-').map(Number);
                const options = [];
                for(let i = -2; i <= 2; i++) {
                    const d = new Date(y, m - 1 + i, 1);
                    options.push({ year: d.getFullYear(), month: d.getMonth() + 1 });
                }
                return options;
            }, [currentMonth]);

            const renderHome = () => (
                <div className="animate-slide-in">
                    {/* メインカードエリア */}
                    <div className="bg-gradient-to-br from-indigo-700 via-indigo-600 to-blue-500 text-white p-8 pt-6 rounded-b-[3.5rem] shadow-xl relative overflow-hidden">
                        <div className="absolute -right-8 -top-8 w-40 h-40 bg-white/10 rounded-full blur-3xl"></div>
                        <div className="flex justify-between items-center mb-2">
                            <p className="text-blue-100 text-xs font-black opacity-80 uppercase tracking-[0.2em]">残高合計</p>
                            <div className="bg-white/20 px-3 py-1 rounded-full text-[10px] font-black uppercase backdrop-blur-md border border-white/20">
                                {spentPercentage.toFixed(0)}% 使用中
                            </div>
                        </div>
                        <h1 className="text-5xl font-black mb-6 tracking-tighter tabular-nums drop-shadow-lg">
                            <span className="text-3xl mr-1 opacity-50">¥</span>{balance.toLocaleString()}
                        </h1>
                        
                        <div className="w-full bg-black/20 h-4 rounded-full mb-8 overflow-hidden backdrop-blur-sm border border-white/10 shadow-inner p-[2px]">
                            <div className={`h-full transition-all duration-1000 ease-out rounded-full shadow-lg ${spentPercentage > 90 ? 'bg-rose-400' : spentPercentage > 70 ? 'bg-amber-400' : 'bg-emerald-400'}`} style={{ width: `${Math.min(100, spentPercentage)}%` }}></div>
                        </div>

                        <div className="grid grid-cols-2 gap-4">
                            <button onClick={() => {setTempBudget(budget); setIsSettingBudget(true)}} className="bg-white/10 p-5 rounded-[2rem] border border-white/10 text-left hover:bg-white/20 active:scale-95 transition-all shadow-sm">
                                <p className="text-[10px] uppercase opacity-70 font-black tracking-widest mb-1.5 flex items-center gap-1">
                                    <Icon name="target" size={10} /> 総予算
                                </p>
                                <p className="text-xl font-black tabular-nums">¥{budget.toLocaleString()}</p>
                            </button>
                            <div className="bg-white/10 p-5 rounded-[2rem] border border-white/10 text-left shadow-sm">
                                <p className="text-[10px] uppercase opacity-70 font-black tracking-widest mb-1.5 flex items-center gap-1">
                                    <Icon name="trending-down" size={10} /> 支出計
                                </p>
                                <p className="text-xl font-black text-rose-100 tabular-nums">¥{totalSpent.toLocaleString()}</p>
                            </div>
                        </div>
                    </div>

                    <div className="px-6 -mt-6">
                        {/* 予算設定フォーム */}
                        {isSettingBudget && (
                            <div className="mb-6 bg-white p-6 rounded-[2.5rem] shadow-2xl border-2 border-indigo-500 animate-slide-in relative z-20">
                                <div className="flex justify-between items-center mb-6">
                                    <h3 className="font-black text-slate-800 text-sm uppercase tracking-widest">今月の予算を設定</h3>
                                    <button onClick={() => setIsSettingBudget(false)} className="text-slate-300"><Icon name="x" size={20}/></button>
                                </div>
                                <div className="relative mb-8">
                                    <span className="absolute left-0 top-1/2 -translate-y-1/2 text-3xl font-black text-slate-300">¥</span>
                                    <input type="number" className="w-full pl-8 p-2 text-5xl font-black border-b-4 border-indigo-500 outline-none text-slate-800 bg-transparent" value={tempBudget} onChange={(e) => setTempBudget(e.target.value)} autoFocus />
                                </div>
                                <button onClick={() => {updateFirebase({ budget: Number(tempBudget) }); setIsSettingBudget(false)}} className="w-full bg-indigo-600 text-white py-5 rounded-2xl font-black shadow-lg shadow-indigo-100 active:scale-95 transition-all">
                                    この金額で確定する
                                </button>
                            </div>
                        )}

                        {/* メイン入力フォーム */}
                        <div className="bg-white p-7 rounded-[3rem] shadow-sm border border-slate-100 mb-8 mt-12">
                            <h2 className="text-[11px] font-black text-slate-400 uppercase tracking-[0.2em] mb-5 flex items-center gap-2">
                                <span className="w-2 h-2 bg-indigo-500 rounded-full"></span> 支出を記録
                            </h2>
                            <form onSubmit={addExpense} className="space-y-5">
                                <div className="space-y-4">
                                    <div className="relative">
                                        <Icon name="edit-3" size={16} className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-300" />
                                        <input
                                            ref={itemNameInputRef}
                                            type="text"
                                            placeholder="品目（例: 昼食代）"
                                            className="w-full p-4 pl-11 bg-slate-50 rounded-2xl outline-none text-sm font-bold border-2 border-transparent focus:border-indigo-100 focus:bg-white transition-all"
                                            value={itemName}
                                            onChange={(e) => setItemName(e.target.value)}
                                            onKeyDown={(e) => {
                                                if (e.key === 'Enter' && (!itemAmount || Number(itemAmount) <= 0)) {
                                                    e.preventDefault();
                                                    itemAmountInputRef.current?.focus?.();
                                                }
                                            }}
                                        />
                                    </div>
                                    <div className="relative">
                                        <span className="absolute left-4 top-1/2 -translate-y-1/2 font-black text-slate-300 text-lg">¥</span>
                                        <input
                                            ref={itemAmountInputRef}
                                            type="number"
                                            placeholder="金額"
                                            className="w-full p-4 pl-10 bg-slate-50 rounded-2xl outline-none text-2xl font-black border-2 border-transparent focus:border-indigo-100 focus:bg-white transition-all tabular-nums"
                                            value={itemAmount}
                                            onChange={(e) => setItemAmount(e.target.value)}
                                        />
                                    </div>
                                    
                                    <div className="flex flex-wrap gap-2 pt-2">
                                        {tags.map(tag => (
                                            <button
                                                type="button"
                                                key={tag}
                                                onClick={() => setSelectedTag(tag === selectedTag ? '' : tag)}
                                                className={`px-5 py-2.5 rounded-xl text-xs font-black transition-all border-2 ${
                                                    selectedTag === tag
                                                        ? `${tagColor(tag).bg} ${tagColor(tag).text} shadow-md border-white/20`
                                                        : `bg-white border-slate-100 text-slate-400 hover:${tagColor(tag).softBg} hover:${tagColor(tag).softText} hover:border-slate-200`
                                                }`}
                                            >
                                                {tag}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                {!canSubmitExpense && (itemName.trim().length > 0 || itemAmount.length > 0) && (
                                    <div className="text-[11px] font-black text-rose-500 bg-rose-50 border border-rose-100 rounded-2xl px-4 py-3">
                                        品目と金額（1円以上）を入力してください
                                    </div>
                                )}
                                <button
                                    disabled={!canSubmitExpense}
                                    className={`w-full py-5 rounded-3xl font-black shadow-xl transition-all flex items-center justify-center gap-3 ${
                                        canSubmitExpense
                                            ? 'bg-slate-900 text-white active:scale-[0.97]'
                                            : 'bg-slate-200 text-slate-400 cursor-not-allowed'
                                    }`}
                                >
                                    <Icon name="plus-circle" size={20} /> 記録を保存
                                </button>
                            </form>
                        </div>

                        {/* 履歴リスト */}
                        <div className="space-y-4 pb-16">
                            <div className="flex justify-between items-center px-2">
                                <h2 className="text-[11px] font-black text-slate-400 uppercase tracking-[0.2em]">最近の履歴</h2>
                                <span className="text-[10px] font-black text-indigo-500 bg-indigo-50 px-2.5 py-1 rounded-full">{expenses.length}件</span>
                            </div>
                            {expenses.length === 0 ? (
                                <div className="text-center py-16 bg-white rounded-[3rem] border-2 border-dashed border-slate-200">
                                    <Icon name="database" className="mx-auto text-slate-200 mb-3" size={32} />
                                    <p className="text-slate-400 text-xs font-bold tracking-widest uppercase">No Records</p>
                                </div>
                            ) : (
                                expenses.map(item => (
                                    <div key={item.id} className="bg-white rounded-[2.5rem] border border-slate-100 shadow-sm overflow-hidden flex flex-col group transition-all hover:shadow-md">
                                        {editingId === item.id ? (
                                            /* 編集フォーム: タグ選択を追加 */
                                            <div className="p-6 bg-indigo-50/50 space-y-4 animate-slide-in">
                                                <div className="space-y-3">
                                                    <input type="text" className="w-full p-4 bg-white rounded-2xl border border-indigo-200 outline-none font-bold text-sm" value={editName} onChange={(e) => setEditName(e.target.value)} placeholder="品目名" />
                                                    <input type="number" className="w-full p-4 bg-white rounded-2xl border border-indigo-200 outline-none font-black text-xl tabular-nums" value={editAmount} onChange={(e) => setEditAmount(e.target.value)} placeholder="金額" />
                                                    
                                                    {/* タグ選択 (編集時) */}
                                                    <div className="flex flex-wrap gap-2 pt-1">
                                                        {tags.map(tag => (
                                                            <button 
                                                                type="button" 
                                                                key={tag} 
                                                                onClick={() => setEditTag(tag)} 
                                                                className={`px-4 py-2 rounded-xl text-[10px] font-black transition-all border-2 ${
                                                                    editTag === tag
                                                                        ? `${tagColor(tag).bg} ${tagColor(tag).text} shadow-sm border-white/20`
                                                                        : `bg-white border-slate-200 text-slate-400 hover:${tagColor(tag).softBg} hover:${tagColor(tag).softText}`
                                                                }`}
                                                            >
                                                                {tag}
                                                            </button>
                                                        ))}
                                                    </div>
                                                </div>
                                                <div className="flex gap-3">
                                                    <button onClick={saveEdit} className="flex-[2] bg-indigo-600 text-white py-4 rounded-2xl font-black shadow-md active:scale-95 transition-all">保存</button>
                                                    <button onClick={() => setEditingId(null)} className="flex-1 bg-white text-slate-400 py-4 rounded-2xl font-bold border border-slate-200 active:scale-95 transition-all">取消</button>
                                                </div>
                                            </div>
                                        ) : (
                                            <div className="p-6">
                                                <div className="flex justify-between items-center mb-5">
                                                    <div className="flex items-center gap-4">
                                                        <div className="w-14 h-14 bg-slate-50 text-indigo-500 rounded-[1.25rem] flex items-center justify-center border border-slate-100">
                                                            <Icon name="receipt" size={24} />
                                                        </div>
                                                        <div>
                                                            <p className="font-black text-slate-800 text-lg leading-tight mb-1.5">{item.name}</p>
                                                            <div className="flex items-center gap-2">
                                                                <span className={`text-[10px] font-black px-2 py-0.5 rounded-md uppercase tracking-wider ${tagColor(item.tag).bg} ${tagColor(item.tag).text}`}>{item.tag}</span>
                                                                <span className="text-[10px] text-slate-400 font-bold tracking-tighter uppercase">{formatExpenseDate(item)}</span>
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <p className="font-black text-slate-900 text-2xl tracking-tighter tabular-nums">
                                                        <span className="text-sm mr-0.5 opacity-30">¥</span>{item.amount.toLocaleString()}
                                                    </p>
                                                </div>
                                                <div className="flex gap-2 pt-2 border-t border-slate-50">
                                                    <button onClick={() => startEdit(item)} className="flex-1 flex items-center justify-center gap-2 text-[11px] font-black text-slate-500 hover:text-indigo-600 bg-slate-50 hover:bg-indigo-50 py-3 rounded-xl transition-all">
                                                        <Icon name="edit-3" size={14} /> 編集
                                                    </button>
                                                    <button onClick={() => deleteExpense(item.id)} className="flex-1 flex items-center justify-center gap-2 text-[11px] font-black text-slate-400 hover:text-rose-500 bg-slate-50 hover:bg-rose-50 py-3 rounded-xl transition-all">
                                                        <Icon name="trash-2" size={14} /> 削除
                                                    </button>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                ))
                            )}
                        </div>
                    </div>
                </div>
            );

            const renderReport = () => (
                <div className="animate-slide-in px-6 pt-8 pb-32">
                    <div className="flex items-end justify-between mb-10">
                        <div>
                            <p className="text-[10px] font-black text-indigo-500 uppercase tracking-[0.3em] mb-1">Analytics</p>
                            <h2 className="text-3xl font-black text-slate-800 tracking-tighter">支出の分析</h2>
                        </div>
                        <div className="text-[10px] font-black bg-slate-100 text-slate-500 px-3 py-1.5 rounded-full border border-slate-200 uppercase tracking-widest">{currentMonth}</div>
                    </div>

                    {selectedTagDetail && (
                        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-xl z-[100] flex items-end justify-center animate-fade-in">
                            <div className="bg-white w-full max-w-md rounded-t-[3.5rem] shadow-2xl animate-slide-in flex flex-col max-h-[85vh] border-t border-white/20">
                                <div className="p-8 pb-4 flex justify-between items-center shrink-0">
                                    <div>
                                        <div className="flex items-center gap-2 mb-1">
                                            <span className="w-3 h-3 bg-indigo-500 rounded-full"></span>
                                            <h3 className="text-2xl font-black text-slate-800 tracking-tighter">{selectedTagDetail}</h3>
                                        </div>
                                        <p className="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">History & Details</p>
                                    </div>
                                    <button onClick={() => setSelectedTagDetail(null)} className="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 active:scale-90 transition-all">
                                        <Icon name="x" size={24} />
                                    </button>
                                </div>
                                <div className="px-8 flex-grow overflow-y-auto hide-scrollbar space-y-4 pb-12 pt-4">
                                    {expenses.filter(e => e.tag === selectedTagDetail).length > 0 ? (
                                        expenses.filter(e => e.tag === selectedTagDetail).map(item => (
                                            <div key={item.id} className="flex justify-between items-center p-5 bg-slate-50 rounded-[2rem] border border-slate-100">
                                                <div className="flex items-center gap-4">
                                                    <div className="w-12 h-12 bg-white rounded-2xl flex items-center justify-center text-indigo-500 shadow-sm border border-slate-100">
                                                        <Icon name="receipt" size={20} />
                                                    </div>
                                                    <div>
                                                        <p className="font-black text-slate-800 text-sm leading-tight mb-1">{item.name}</p>
                                                        <p className="text-[10px] text-slate-400 font-bold uppercase tracking-tighter">{formatExpenseDate(item)}</p>
                                                    </div>
                                                </div>
                                                <p className="font-black text-slate-900 text-lg tabular-nums">¥{item.amount.toLocaleString()}</p>
                                            </div>
                                        ))
                                    ) : (
                                        <div className="py-20 text-center flex flex-col items-center justify-center gap-4 opacity-30">
                                            <Icon name="database" size={48} />
                                            <p className="text-slate-400 font-black text-xs uppercase tracking-[0.2em]">No Data</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="space-y-6">
                        {/* カテゴリ別予算の編集（Report画面用） */}
                        <div className="bg-white p-6 rounded-[3rem] shadow-sm border border-slate-100">
                            <div className="flex items-center justify-between mb-4">
                                <h3 className="text-[11px] font-black text-slate-400 uppercase tracking-[0.2em] flex items-center gap-2">
                                    <span className="w-2 h-2 bg-emerald-500 rounded-full"></span>
                                    カテゴリ別予算を編集
                                </h3>
                            </div>
                            <div className="space-y-2">
                                {tags.map(tag => {
                                    const current = tagBudgets[tag] || 0;
                                    const isEditing = tagToEditBudget === tag;
                                    return (
                                        <div key={tag} className="flex items-center gap-3">
                                            <div className="flex-1 flex items-center gap-2">
                                                <span className="text-sm font-black text-slate-700">{tag}</span>
                                            </div>
                                            {isEditing ? (
                                                <>
                                                    <div className="flex items-center gap-1">
                                                        <span className="text-xs font-black text-slate-300">¥</span>
                                                        <input
                                                            type="number"
                                                            className="w-24 px-2 py-1 text-right text-sm font-black border-b-2 border-indigo-500 outline-none bg-transparent"
                                                            value={tempTagBudget}
                                                            onChange={(e) => setTempTagBudget(e.target.value)}
                                                        />
                                                    </div>
                                                    <button
                                                        onClick={saveTagBudget}
                                                        className="px-3 py-1.5 text-[11px] font-black rounded-xl bg-indigo-600 text-white active:scale-95 transition-all"
                                                    >
                                                        保存
                                                    </button>
                                                    <button
                                                        onClick={() => { setTagToEditBudget(null); setTempTagBudget(''); }}
                                                        className="px-2 py-1.5 text-[11px] font-bold text-slate-400"
                                                    >
                                                        キャンセル
                                                    </button>
                                                </>
                                            ) : (
                                                <>
                                                    <span className="text-sm font-black text-slate-500 w-24 text-right tabular-nums">
                                                        ¥{current.toLocaleString()}
                                                    </span>
                                                    <button
                                                        onClick={() => { setTagToEditBudget(tag); setTempTagBudget(current || ''); }}
                                                        className="px-3 py-1.5 text-[11px] font-black rounded-xl bg-slate-900 text-white active:scale-95 transition-all"
                                                    >
                                                        編集
                                                    </button>
                                                </>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                        </div>

                        {/* 既存のカテゴリ別分析カード */}
                        {tags.map(tag => {
                            const { spent, budget: tBudget } = tagStats[tag];
                            const percent = tBudget > 0 ? (spent / tBudget) * 100 : 0;
                            const isOver = spent > tBudget && tBudget > 0;

                            return (
                                <div key={tag} className="bg-white p-7 rounded-[3rem] shadow-sm border border-slate-100 active:bg-slate-50 transition-all cursor-pointer group" onClick={() => setSelectedTagDetail(tag)}>
                                    <div className="flex justify-between items-start mb-6">
                                        <div className="flex-grow">
                                            <div className="flex items-center gap-2 mb-2">
                                                <h3 className="font-black text-slate-800 text-xl leading-none tracking-tight">{tag}</h3>
                                            </div>
                                            <div className={`text-[10px] font-black uppercase tracking-widest flex items-center gap-1.5 ${isOver ? 'text-rose-500' : 'text-slate-400'}`}>
                                                {isOver ? <Icon name="alert-circle" size={10} /> : <Icon name="check-circle" size={10} />}
                                                {tBudget > 0 ? (isOver ? `予算超過: ¥${(spent - tBudget).toLocaleString()}` : `残り: ¥${(tBudget - spent).toLocaleString()}`) : '予算未設定'}
                                            </div>
                                        </div>
                                        <div className="text-right">
                                            <p className="text-[10px] font-black text-slate-300 uppercase mb-1">使用率</p>
                                            <p className={`text-lg font-black ${isOver ? 'text-rose-500' : 'text-indigo-600'}`}>{percent.toFixed(0)}%</p>
                                        </div>
                                    </div>
                                    <div className="space-y-5">
                                        <div className="w-full bg-slate-100 h-5 rounded-full overflow-hidden border border-slate-50 shadow-inner p-1">
                                            <div className={`h-full transition-all duration-1000 ease-out rounded-full shadow-sm ${isOver ? 'bg-gradient-to-r from-rose-400 to-rose-600' : percent > 85 ? 'bg-gradient-to-r from-amber-400 to-amber-500' : 'bg-gradient-to-r from-indigo-500 to-blue-600'}`} style={{ width: `${Math.min(100, percent)}%` }}></div>
                                        </div>
                                        <div className="flex justify-between items-center pt-2">
                                            <div className="flex items-center gap-2">
                                                <span className="text-[10px] font-black text-slate-400 uppercase">支出</span>
                                                <span className="font-black text-slate-800 tabular-nums text-base">¥{spent.toLocaleString()}</span>
                                            </div>
                                            <div className="flex items-center gap-2">
                                                <span className="text-[10px] font-black text-slate-400 uppercase">予算</span>
                                                <span className="font-bold text-slate-400 tabular-nums text-sm">¥{tBudget.toLocaleString()}</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                        
                        <button onClick={() => setIsAddingTag(true)} className="w-full py-10 border-4 border-dashed border-slate-200 rounded-[3rem] text-slate-300 font-black flex flex-col items-center gap-3 hover:bg-white hover:border-indigo-300 hover:text-indigo-400 transition-all">
                            <Icon name="plus" size={32} />
                            <span className="text-xs uppercase tracking-[0.3em]">新規カテゴリ追加</span>
                        </button>
                    </div>
                    {isAddingTag && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[110] flex items-center justify-center p-6 animate-fade-in">
                            <div className="bg-white w-full max-w-xs p-8 rounded-[3.5rem] shadow-2xl animate-zoom-in border border-white/20">
                                <h3 className="text-[11px] font-black text-slate-400 uppercase mb-6 text-center tracking-widest">新しいカテゴリ名</h3>
                                <input type="text" placeholder="食費、趣味など" className="w-full p-2 text-2xl font-black border-b-4 border-indigo-500 outline-none mb-8 text-center bg-transparent" value={newTagName} onChange={(e) => setNewTagName(e.target.value)} autoFocus />
                                <div className="flex flex-col gap-3">
                                    <button onClick={handleAddTag} className="bg-slate-900 text-white py-4 rounded-2xl font-black shadow-lg">追加する</button>
                                    <button onClick={() => setIsAddingTag(false)} className="text-slate-400 py-2 font-black text-[10px] uppercase tracking-widest">キャンセル</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );

            const { year: dYear, month: dMonth } = displayDate();

            return (
                <div className="max-w-md mx-auto bg-slate-50 min-h-screen shadow-2xl flex flex-col relative font-sans overflow-x-hidden">
                    <div className="glass-header text-white px-2 py-6 flex flex-col gap-4 shadow-xl sticky top-0 z-[60] rounded-b-[2rem]">
                        <div className="flex justify-between items-center px-6">
                            <button onClick={() => changeMonth(-1)} className="w-14 h-14 bg-white/10 hover:bg-white/20 active:scale-90 rounded-2xl flex items-center justify-center transition-all border border-white/10">
                                <Icon name="chevron-left" size={32} />
                            </button>
                            
                            <div className="flex flex-col items-center cursor-pointer group" onClick={() => setIsMonthPickerOpen(!isMonthPickerOpen)}>
                                <p className="text-[10px] font-black text-indigo-200 uppercase tracking-[0.4em] mb-1 group-hover:text-white transition-colors">
                                    {dYear}
                                </p>
                                <div className="flex items-center gap-3">
                                    <span className="font-black text-4xl tracking-tighter leading-none">{dMonth}<span className="text-xl ml-1 opacity-60">月</span></span>
                                    <Icon name={isMonthPickerOpen ? "chevron-up" : "chevron-down"} size={20} className="text-indigo-300 group-hover:text-white transition-all" />
                                </div>
                            </div>
                            
                            <button onClick={() => changeMonth(1)} className="w-14 h-14 bg-white/10 hover:bg-white/20 active:scale-90 rounded-2xl flex items-center justify-center transition-all border border-white/10">
                                <Icon name="chevron-right" size={32} />
                            </button>
                        </div>

                        {isMonthPickerOpen && (
                            <div className="px-4 py-2 flex flex-wrap justify-center gap-2 animate-slide-in">
                                {quickMonthSelect.map((opt, idx) => (
                                    <button key={idx} onClick={() => setSpecificMonth(opt.year, opt.month)} className={`px-4 py-2 rounded-xl text-xs font-black transition-all border ${opt.month === dMonth && opt.year === parseInt(dYear) ? 'bg-white text-indigo-700 shadow-lg' : 'bg-indigo-600/50 text-white border-white/10 hover:bg-indigo-500'}`}>
                                        {opt.month}月
                                    </button>
                                ))}
                            </div>
                        )}
                    </div>

                    <div className="flex-grow">
                        {view === 'home' ? renderHome() : renderReport()}
                    </div>

                    {undoToast && (
                        <div className="fixed bottom-28 left-1/2 -translate-x-1/2 w-[92%] max-w-[420px] z-[120] animate-slide-in">
                            <div className="bg-slate-900/95 text-white backdrop-blur-2xl rounded-[2rem] border border-white/10 shadow-2xl p-4 flex items-center gap-3">
                                <div className="w-10 h-10 rounded-2xl bg-white/10 flex items-center justify-center shrink-0">
                                    <Icon name="trash-2" size={18} />
                                </div>
                                <div className="flex-grow min-w-0">
                                    <p className="text-[11px] font-black tracking-widest uppercase text-slate-300">Deleted</p>
                                    <p className="font-black text-sm truncate">
                                        「{undoToast.label}」を削除しました
                                    </p>
                                </div>
                                <button
                                    onClick={undoDelete}
                                    className="shrink-0 px-4 py-2 rounded-2xl font-black text-xs bg-white text-slate-900 active:scale-95 transition-all"
                                >
                                    取り消す
                                </button>
                                <button
                                    onClick={() => setUndoToast(null)}
                                    className="shrink-0 w-10 h-10 rounded-2xl bg-white/10 flex items-center justify-center text-white/70 hover:text-white active:scale-90 transition-all"
                                    aria-label="閉じる"
                                >
                                    <Icon name="x" size={18} />
                                </button>
                            </div>
                        </div>
                    )}
                    
                    <div className="fixed bottom-8 left-1/2 -translate-x-1/2 w-[85%] max-w-[380px] bg-slate-900/90 backdrop-blur-2xl p-2 rounded-[2.5rem] flex justify-around items-center z-50 shadow-2xl border border-white/10">
                        <button onClick={() => setView('home')} className={`flex-1 flex flex-col items-center gap-1 py-4 rounded-[2rem] transition-all ${view === 'home' ? 'bg-indigo-600 text-white shadow-xl scale-105' : 'text-slate-500 hover:text-slate-300'}`}>
                            <Icon name="home" size={22} />
                            <span className="text-[9px] font-black uppercase tracking-[0.2em]">Home</span>
                        </button>
                        <button onClick={() => setView('report')} className={`flex-1 flex flex-col items-center gap-1 py-4 rounded-[2rem] transition-all ${view === 'report' ? 'bg-indigo-600 text-white shadow-xl scale-105' : 'text-slate-500 hover:text-slate-300'}`}>
                            <Icon name="pie-chart" size={22} />
                            <span className="text-[9px] font-black uppercase tracking-[0.2em]">Report</span>
                        </button>
                        <button className="flex-1 flex flex-col items-center gap-1 py-4 text-slate-700 opacity-40 cursor-not-allowed">
                            <Icon name="settings" size={22} />
                            <span className="text-[9px] font-black uppercase tracking-[0.2em]">Settings</span>
                        </button>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
